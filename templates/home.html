<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">POS Dashboard</span>
    <a href="/logout" class="btn btn-outline-light btn-sm">Salir</a>
</nav>

<div class="container mt-5">

    <div class="card shadow-sm p-4">
        <h4>Bienvenido 👋 {{ user.username }}</h4>
        <p class="text-muted">Rol: <b>{{ user.role }}</b></p>

        <hr>

        <div class="row">
            <div class="col-md-4">
                <div class="card p-3">
                    <h6>Ventas</h6>
                    <p class="text-muted">Módulo futuro POS</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3">
                    <h6>Productos</h6>
                    <p class="text-muted">Inventario</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3">
                    <h6>Reportes</h6>
                    <p class="text-muted">Estadísticas</p>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
